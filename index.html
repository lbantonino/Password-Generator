<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/Javascript/2.Password Generator/style.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="page">
      <section class="password-card" aria-labelledby="password-title">
        <div class="password-card__content">
          <h1 id="password-title" class="password-card__title">
            Generate a <span>random password</span>
          </h1>

          <p class="password-card__description">
            Never use an insecure password again.
          </p>

          <button class="btn-generate" type="button">Generate passwords</button>

          <div class="password-card__divider"></div>

          <div class="password-card__choices">
            <div class="password-card__choice first-choice"></div>
            <div class="password-card__choice second-choice"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="/Javascript/2.Password Generator/index.js"></script>
  </body>
</html>
